# Deploys the static landing page (packages/website) to GitHub Pages.
# Requires the repo setting: Pages → Source → GitHub Actions (one-time, manual).
name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ["packages/website/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/website
      - id: deployment
        uses: actions/deploy-pages@v4
