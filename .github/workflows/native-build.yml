name: Native build

# Compile smoke tests for the platform sides that the host-side test matrix
# (ci.yml) cannot see: the native gtests link neither skity nor any platform
# SDK, so podspec/prefab/CMake/JNI/OC regressions (e.g. a skity version bump)
# are invisible there. Both jobs compile the full example app per platform.
# Public repo: all runners are free; Android ~10 min (ubuntu), iOS ~15-20 min
# (macos).
#
# Both jobs are REQUIRED status checks on develop, so pull_request carries no
# paths filter — a workflow skipped by path filtering never reports and the
# required check would sit on "Expected — Waiting for status" forever.
# Instead each job probes the PR diff (three-dot against the base branch) and
# short-circuits green when the inputs it compiles are untouched. push events
# keep the workflow-level paths filter: if the workflow runs at all, the
# paths matched, so the probe always says run=true there.

on:
  push:
    branches: [develop]
    paths:
      - "packages/native/**"
      - "packages/example/android/**"
      - "packages/example/ios/**"
      - "pnpm-lock.yaml"
      - "DEPS.py"
      - "tools/hab*"
      - ".github/workflows/native-build.yml"
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      # Full history: the change probe diffs against the PR base branch and
      # needs the merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe for relevant changes
        id: probe
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE \
            '^(packages/native/|packages/example/android/|pnpm-lock\.yaml$|DEPS\.py$|tools/hab|\.github/workflows/native-build\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Why the JS toolchain for a native build: the Lynx gradle plugin's
      # autolink walks node_modules, and generate-fbs needs the flatc binary.
      - uses: pnpm/action-setup@v4
        if: steps.probe.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.probe.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      # flatc is a per-OS binary from DEPS.py, so the cache key carries the
      # OS — a cache saved on linux must never be restored on macos.
      - uses: actions/cache@v4
        if: steps.probe.outputs.run == 'true'
        with:
          path: packages/native/shared/third_party
          key: habitat-${{ runner.os }}-${{ hashFiles('DEPS.py') }}

      - name: Sync third-party deps (habitat)
        if: steps.probe.outputs.run == 'true'
        run: tools/hab sync

      - name: Install workspace
        if: steps.probe.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # CMakeLists compiles the generated FlatBuffer .cc stubs; also produces
      # the Java stubs under android/.
      - name: Generate FlatBuffer stubs
        if: steps.probe.outputs.run == 'true'
        run: pnpm --filter @scumble/native generate-fbs

      # Gradle build cache + dependency cache (the Lynx/skity AARs from
      # mavenCentral and the NDK/cmake downloads via AGP).
      - uses: actions/setup-java@v5
        if: steps.probe.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.probe.outputs.run == 'true'

      - name: Build example app (all ABIs, externalNativeBuild included)
        if: steps.probe.outputs.run == 'true'
        working-directory: packages/example/android
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Summarize native libs
        if: always() && steps.probe.outputs.run == 'true'
        run: find packages/example/android/app/build -name "*.so" -exec ls -lh {} +

  ios-build:
    name: iOS xcodebuild (iphonesimulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe for relevant changes
        id: probe
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE \
            '^(packages/native/|packages/example/ios/|pnpm-lock\.yaml$|DEPS\.py$|tools/hab|\.github/workflows/native-build\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.probe.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.probe.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/cache@v4
        if: steps.probe.outputs.run == 'true'
        with:
          path: packages/native/shared/third_party
          key: habitat-${{ runner.os }}-${{ hashFiles('DEPS.py') }}

      - name: Sync third-party deps (habitat)
        if: steps.probe.outputs.run == 'true'
        run: tools/hab sync

      - name: Install workspace
        if: steps.probe.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # The pod compiles ScumbleRenderer.cc, which includes the generated
      # headers (header search paths also point into third_party/flatbuffers).
      - name: Generate FlatBuffer stubs
        if: steps.probe.outputs.run == 'true'
        run: pnpm --filter @scumble/native generate-fbs

      # Gemfile pins CocoaPods ~1.16 + cocoapods-lynx-library (autolink).
      # ruby-version must be explicit: the repo pins ruby via mise.toml,
      # which setup-ruby cannot read (it only understands .ruby-version /
      # .tool-versions). 3.4 tracks the local mise-pinned 3.4.x.
      - uses: ruby/setup-ruby@v1
        if: steps.probe.outputs.run == 'true'
        with:
          ruby-version: "3.4"
          working-directory: packages/example/ios
          bundler-cache: true

      # Lynx + skity pods are large downloads; cache the installed Pods tree
      # and let `pod install` reconcile against Podfile.lock on restore.
      - uses: actions/cache@v4
        if: steps.probe.outputs.run == 'true'
        with:
          path: packages/example/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('packages/example/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: pod install
        if: steps.probe.outputs.run == 'true'
        working-directory: packages/example/ios
        run: bundle exec pod install

      - name: Build example app (simulator, no signing needed)
        if: steps.probe.outputs.run == 'true'
        working-directory: packages/example/ios
        run: |
          xcodebuild build \
            -workspace ScumbleDemo.xcworkspace \
            -scheme ScumbleDemo \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
