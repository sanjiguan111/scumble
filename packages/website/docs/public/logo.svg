<!-- scumble mark: dry-brush sweeps (the "scumble" painting technique),
     fading left-to-right, on the canvas navy tile. Same mark as
     favicon.svg (kept as a separate file so they can diverge later). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="22" fill="#101736" stroke="#2a3765" stroke-width="1.5"/>
  <g transform="translate(48 48) rotate(-35)">
    <rect x="-28" y="-23" width="52" height="9.5" rx="4.75" fill="url(#g)"/>
    <rect x="-28" y="-8" width="40" height="9.5" rx="4.75" fill="url(#g)" opacity="0.66"/>
    <rect x="-28" y="7" width="27" height="9.5" rx="4.75" fill="url(#g)" opacity="0.4"/>
  </g>
</svg>
